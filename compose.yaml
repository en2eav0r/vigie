# Vigie server. Works with Docker and Podman.
# Vigie listens on 127.0.0.1 only: it is published on the Internet through the Cloudflare tunnel (or a reverse
# proxy such as Caddy), which provides HTTPS. Nothing else on the host can reach it from outside.
services:
  vigie:
    build: .
    image: vigie-server:latest
    container_name: vigie
    env_file: .env
    environment:
      VIGIE_DB: /app/state/vigie.db
    ports:
      - "127.0.0.1:8740:8740"
    volumes:
      - vigie-state:/app/state
    networks:
      - vigie
    restart: unless-stopped
    # Locked down: no root, read-only filesystem, no extra Linux capabilities, bounded memory and processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS on a public name. Not needed when a Cloudflare tunnel publishes Vigie: then run only "vigie".
  caddy:
    image: caddy:2.10
    container_name: vigie-caddy
    depends_on:
      - vigie
    environment:
      VIGIE_PUBLIC_HOST: ${VIGIE_PUBLIC_HOST:-localhost}
      VIGIE_HTTPS_PORT: ${VIGIE_HTTPS_PORT:-443}
    ports:
      - "80:80"
      - "${VIGIE_HTTPS_PORT:-443}:${VIGIE_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - vigie
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vigie:
    name: vigie

volumes:
  vigie-state:
    name: vigie-state
  caddy-data:
    name: vigie-caddy-data
  caddy-config:
    name: vigie-caddy-config
